# article_scanner sources
#
# kind:
#   rss         — RSS/Atom feed URL
#   html        — HTML index page; runner grabs <a href> anchors
#   hn_top      — Hacker News top-N via Firebase API (url is a token)
#   reddit_json — https://www.reddit.com/r/<sub>/new.json?limit=100
#
# Each source has an id, a display name, a URL, a fetch kind, and tags.
# `enabled: false` skips without deleting. Order matters only for logs.
#
# Fetch discipline:
#   * respects robots.txt (runner checks per host, caches for 24h)
#   * 1.5s inter-request delay to reddit
#   * 50ms inter-item delay for HN
#   * WSJ/NYT: preview snippet only from feed; NEVER fetch the full page

sources:

  # -- AI newsletters (RSS/Atom preferred) ---------------------------------
  - id: tldr_ai
    name: "TLDR AI"
    url: https://tldr.tech/api/rss/ai
    kind: rss
    tags: [ai, newsletter, curated]
    enabled: true

  - id: bens_bites
    name: "Ben's Bites"
    url: https://bensbites.beehiiv.com/feed
    kind: rss
    tags: [ai, newsletter, tools]
    enabled: true

  - id: import_ai
    name: "Import AI (Jack Clark)"
    url: https://importai.substack.com/feed
    kind: rss
    tags: [ai, research, policy]
    enabled: true

  - id: the_rundown
