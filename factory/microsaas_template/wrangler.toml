# wrangler.toml — Cloudflare Pages project config for a micro-SaaS unit.
# The `name` is overwritten by `scripts/deploy.mjs` before publish so each
# unit lands on its own project (and its own <slug>.pages.dev subdomain).
name = "microsaas-template"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[env.production]
# custom domain wiring is done post-deploy in the CF dashboard; see README.md
