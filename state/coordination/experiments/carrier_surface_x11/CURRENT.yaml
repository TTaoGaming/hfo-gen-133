The Gmail metadata-read campaign completed 4/4 with disposition KEEP for the
narrowly bounded connected message-ID search capability. Four identical fixed
impossible-subject probes returned zero identifiers and no continuation token
with connector latencies of 395, 262, 396, and 300 ms. No interactive login,
content read, identifier persistence, mutation, send, operator relay, or
sensitive readback externalization occurred. The next campaign is Calendar
metadata-read visibility using a fixed impossible marker on the primary
calendar inside a bounded 2026 UTC window; wake 1 has not yet run.
