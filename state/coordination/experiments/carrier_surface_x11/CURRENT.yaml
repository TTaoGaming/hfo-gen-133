Google Drive read visibility completed four accepted wakes with KEEP gates. Four
identical synthetic negative-control metadata searches returned zero results and
no errors without interactive login, content fetch, or private-data export. The
single wake-3 latency increase did not repeat; wake 4 returned to 1013 ms. This
keeps the surface for bounded targeted metadata queries only and does not prove
positive recall, corpus completeness, content permission, shared-drive coverage,
or independent verification. The next controlled factor is Gmail read visibility
using the same privacy-safe negative-control pattern.
