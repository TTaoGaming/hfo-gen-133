executed the fixed bounded impossible-marker search and returned zero events with no continuation
token. Disposition is KEEP only for repeatable bounded search execution and sanitized count
visibility; it does not establish calendar completeness, recall, freshness, content access,
authenticity, notification delivery, or independent verification. The next campaign tests the
Google Drive read surface with one fixed impossible-marker document-metadata-only bounded search.
