Google Calendar read visibility completed four accepted wakes with KEEP gates. Four
identical bounded primary-calendar synthetic negative-control searches returned zero
events and no errors without interactive login, event-detail reads, mutation, or
private event-data externalization. All exposed connector latency observations
remained sub-second. This keeps the surface for exact targeted primary-calendar
metadata searches only and does not prove positive recall, complete calendar
visibility, secondary or shared-calendar coverage, event-detail permission, search
semantics, useful operator outcomes, or independent verification. The next
controlled factor is prompt/context size using non-sensitive deterministic payloads
at 1 KiB, 4 KiB, 16 KiB, and 64 KiB with exact size, hash, and boundary-sentinel
checks.
