Gmail read visibility completed four accepted wakes with KEEP gates. Four
identical synthetic negative-control message-ID searches returned zero results
and no errors without interactive login, message fetch, or sender, subject,
snippet, or body export. All exposed connector latency observations remained
sub-second. This keeps the surface for bounded exact message-ID searches only and
does not prove positive recall, mailbox completeness, label or delegated-account
coverage, message-content permission, useful operator outcomes, or independent
verification. The next controlled factor is Google Calendar read visibility using
a bounded primary-calendar negative-control search without reading event bodies.
