Gmail read-surface V1 completed four accepted wakes. The authenticated connector repeatedly
executed the fixed bounded impossible-marker search and returned zero message identifiers with no
continuation token. Disposition is KEEP only for repeatable bounded search execution and sanitized
count visibility; it does not establish mailbox completeness, recall, freshness, content access,
authenticity, or independent verification. The next campaign tests the Calendar read surface with
one fixed impossible-marker metadata-only bounded search.
