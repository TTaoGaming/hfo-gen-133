Wake 4 reproduced the same wrapper-offset calculation at +67 seconds. Across four
accepted wakes, the wrapper timestamp appeared on both sides of the nominal
boundary. The campaign therefore reseats the variable rather than pretending this
is scheduler latency. The next bounded factor is deterministic public web read
visibility against an official IANA page.
