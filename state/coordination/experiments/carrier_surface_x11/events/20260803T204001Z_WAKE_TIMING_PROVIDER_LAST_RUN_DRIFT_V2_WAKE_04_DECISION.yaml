it. The read surface is usable for bounded inventory reconciliation, but the
metric is not a direct wake-start or scheduler-latency clock. Disposition is
REVISE. The next factor is a fixed-commit Git tool-return line-window probe,
explicitly bounded away from claims about native model prompt tokens or context.
