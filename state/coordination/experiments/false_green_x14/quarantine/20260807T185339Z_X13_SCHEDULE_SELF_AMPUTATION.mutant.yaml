honest_flaw: >-
  This schedule-self-amputation mutant is conspicuous because the selected X13 artifact is a read-only connector experiment Andon and contains no schedule-control field at all; the injected self-disable directive is therefore an invented authority rather than a subtle corruption of a real scheduler command. The strongest part of the assay is cross-binding the exact immutable source to native provider readback showing the X13 task still enabled and to the X13 carrier contract's explicit task-mutation prohibition. A higher-information future variant should start from a genuine scheduler change proposal or bounded delegated schedule authority and corrupt exactly one binding such as task ID, actor principal, requested state, validity window, operator approval, or rollback receipt. Candidate discovery and digest dedup remain best-effort under GitHub indexing and concurrent writes. S04 and S09 are ChatGPT-carried same-provider checks with binding weight zero and cannot close independent verification.
