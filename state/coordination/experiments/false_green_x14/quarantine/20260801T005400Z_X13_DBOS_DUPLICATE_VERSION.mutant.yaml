honest_flaw: >-
  The X13 source schema has no explicit idempotency key, so this assay tests version replay and
  monotonicity rather than duplicate-key rejection. CURRENT is a mutable projection written in a
  separate commit and is not a transactional ledger; a verifier must distinguish that limitation
  from the simpler structural defect that prior_version equals next_version. Repository search
  cannot prove global uniqueness, the mutant-overlay schema is not formally registered, and the
  distinct-provider route remains requested rather than observed.
