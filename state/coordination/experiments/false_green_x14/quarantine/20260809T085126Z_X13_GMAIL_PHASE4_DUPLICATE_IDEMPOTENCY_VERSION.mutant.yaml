honest_flaw: >-
  The source event has an explicit expected_current_version and a durable CURRENT v204 readback that proves this exact event was consumed once, so the replay defect is concrete. However, the source does not carry a separate explicit idempotency key or nonce; this assay therefore relies on the verifier treating the immutable event digest plus version-transition history as the single-consumption identity. A stronger duplicate/idempotency mutant would start from a source that independently binds WorkItem ID, idempotency key, nonce, prior version, next version, and accepted event digest, then corrupt exactly one replay edge. Candidate discovery and digest dedup remain best-effort under concurrent Git writes and search-index lag. S04 and S09 remain same-provider checks with binding weight zero and cannot close independent verification.
