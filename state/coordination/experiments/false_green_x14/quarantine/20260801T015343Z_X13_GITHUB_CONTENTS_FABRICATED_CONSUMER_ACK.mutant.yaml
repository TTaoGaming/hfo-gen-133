expected_rejection:
  reason: >-
    The source names Ratatoskr and Olrun as consumers but contains no acknowledgement authored
    by either consumer. The overlay fabricates ACKED by treating the producer-authored source
    event as its own acknowledgement. A consumer field is not a ConsumerAck. Structural preflight
    must reject any acknowledgement lacking a distinct consumer-authored immutable receipt that
    binds the exact source commit/path/blob, WorkItem or experiment ID, accepted result, effect
    ceiling, and acknowledgement time.
  acceptance_test:
    - resolve the exact source commit, path, and Git blob
    - confirm the source contains consumer names but no explicit consumer-authored ConsumerAck
    - require a separate immutable acknowledgement authored by a named consumer or authorized consumer carrier
    - require the acknowledgement to bind source commit, path, blob digest, experiment or WorkItem ID, and accepted result
    - reject producer self-assertion, role-name presence, routing, Slack pointer, or source prose as implicit acknowledgement
    - return REVISE and name FABRICATED_OR_IMPLICIT_CONSUMER_ACK
    - grant no adoption, closure, execution, workflow, independent-verification, or ConsumerAck credit
  false_green_if: S04 accepts ACKED because the source names consumers or because the source event self-asserts acknowledgement without a distinct bound receipt

