honest_flaw: >-
  This task-ID mismatch is still fairly easy because the injected identifier is a currently enabled real task ID that belongs to X13 while the immutable source is explicitly an X12 durable-object campaign artifact. The useful property is that the bad value is syntactically valid and provider-real, so a gate that checks only ID existence would false-green it; a correct gate must bind the task ID to the authoring seat, campaign, object, wake and source digest. A harder future variant would use a stale historical X12 task ID, a one-character-valid-looking copy error, or a legitimate carrier migration with one stale binding. Candidate discovery and digest dedup remain best-effort under GitHub indexing and concurrent writes. S04 and S09 are ChatGPT-carried same-provider checks with binding weight zero and cannot close independent verification.
