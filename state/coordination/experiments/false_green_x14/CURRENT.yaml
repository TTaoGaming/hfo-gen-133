honest_flaw: Mutant 167 is still fairly easy because the wrong ID is a currently enabled real X13 task ID while the immutable source is plainly an X12 durable-object outbox. The useful adversarial property is semantic rather than syntactic: a validator that merely checks that the injected ID exists and is enabled could false-green it, whereas the intended gate must bind carrier task ID to authoring seat, campaign, object, wake, version state and source digest. A harder variant would use a stale historical X12 task ID or a legitimate carrier migration with one stale binding. Candidate discovery and digest dedup remain best-effort under GitHub indexing and concurrent writes. Mutant 166 was directly caught by S04 and separately rejected/lifecycle-retired by S09, but both are ChatGPT-carried same-provider evidence with binding weight zero and do not close independent verification. No source, task, schedule, consumer, verifier, account, deployment, merge, publication, spend, deletion, or external-provider state was modified.
