honest_flaw: >-
  Mutant 204 is source-local and exploits a common false-green confusion: a named consumer plus an accepted-with-gates phase is not a ConsumerAck. The source binds no consumer receipt, acknowledgment digest, acceptance event, or downstream consumption, so this specimen is still easier than a near-valid forged ack and may be rejected by simple schema-presence checks. A stronger fabricated-ConsumerAck mutation should start from a legitimate ack for another digest, version, scope, or consumer and alter exactly one binding while preserving a structurally valid receipt. Campaign 50's direct-route accounting defect remains unresolved, and mutant 203 was again semantically rejected only through an embedded S04 assay rather than direct primary selection. Candidate discovery and digest dedup remain best-effort under concurrent Git writes and indexing lag. S04 and S09 are same-provider, binding weight zero, and cannot close independent verification. No source, task, schedule, deployment, merge, publication, account/security state, spend, deletion, secret exposure, or independent-provider state was modified.
