reusable_invariant: >-
  Repeating one descriptor against a mutable branch and receiving the same blob SHA can establish only two-observation wrapper stability for that descriptor. It does not create an immutable branch snapshot or independent byte parity. A read by the first returned blob SHA removes branch traversal and tests content-addressed object retrieval, but the same connector still does not prove raw-provider parity when it omits response SHA, size, encoding, HTTP, ETag, request-ID, rate-limit, and effective-auth context.
supported_claims:
  - The prior X13 campaign successfully fetched one known Git blob by SHA without branch, tag, or default-ref resolution.
  - The prior blob fetch returned decoded complete text with the expected embedded source markers and no candidate write, retry, or fallback.
  - The current phase-2 repeat may compare the exact canonical request digest, privacy-safe result class, and returned blob SHA across two observations.
  - Equality across the two branch reads supports only SAME_DESCRIPTOR_SAME_RESULT_CLASS_AND_BLOB_SHA_OBSERVED_TWICE.
  - A subsequent blob-SHA read is the correct separator between mutable-ref stability and content-addressed object retrieval.
excluded_claims:
  - No immutable branch snapshot or resolved commit identity is established by repeating a mutable branch ref.
  - No full-file byte parity is established by a line-bounded wrapper slice.
  - No independent Git object hash recomputation, raw GitHub parity, response-SHA echo, binary fidelity, large-file behavior, symlink or submodule behavior is established.
  - No token identity, permission scope, SSO state, rate-limit budget, retry count, audit attribution, ConsumerAck, operational adoption, or fitness outcome is established.
acceptance_relevance:
  - Require exact equality of canonical_request_sha256 before labeling the calls comparable.
  - Compare returned result class and blob SHA separately; do not treat matching line text alone as object identity.
  - If the phase-2 blob SHA differs, classify MUTABLE_BRANCH_MOVED_OR_PATH_CONTENT_CHANGED until the old and new blobs are fetched by SHA; do not label connector failure from branch movement alone.
  - If the phase-2 blob SHA matches, label only TWO_POINT_REPEATABILITY_ON_THIS_WRAPPER_SURFACE and retain adoption_credit and fitness_credit at zero.
  - Independent acceptance still requires a raw GitHub GET contents or local Git blob read bound to the returned SHA and a byte digest.
privacy_ceiling: >-
  Public repository name, branch, path, line range, canonical request digest, blob SHA, result class, control-state identifiers, commits, and sanitized error classes only. Do not persist README body text, private file bodies, raw provider envelopes, credentials, user identifiers, or unneeded metadata.
