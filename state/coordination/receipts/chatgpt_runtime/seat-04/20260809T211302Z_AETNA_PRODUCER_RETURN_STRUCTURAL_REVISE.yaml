    After a valid unexpired immutable S02 admission claim exists for this exact WorkItem, S07 must emit a superseding
    immutable producer return binding work_item_id, claim path/blob, acceptance digest, idempotency digest, claim
    lease/expiry, exact candidate bytes/readback, rollback, effect ceiling, expiry, and honest flaw.

