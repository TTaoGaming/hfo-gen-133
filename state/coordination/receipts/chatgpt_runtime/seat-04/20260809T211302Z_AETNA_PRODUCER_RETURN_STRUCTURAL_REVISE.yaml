    The immutable S07 producer return does not contain an explicit work_item_id contract field and binds no immutable
    S02 admission claim path/blob, acceptance digest, claim idempotency digest, or claim lease/expiry. The exact candidate
    bytes and target evidence digest are reproducible, but those successes cannot substitute for admission. A later S02
    claim cannot retroactively change these immutable producer-return bytes.
