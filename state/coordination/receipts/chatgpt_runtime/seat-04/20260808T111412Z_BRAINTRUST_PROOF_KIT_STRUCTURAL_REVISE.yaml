honest_flaw: >-
  This preflight independently recomputed the route idempotency digest and the strongest current
  X14 mutation overlay, and read back exact Git blob identities for the route, producer return,
  target card, mutant, and mutant source. It did not obtain a local checkout or a machine-readable
  byte-stream bridge from the connector, so it did not independently recompute whole-file SHA-256
  values from local byte arrays. Git blob identity therefore carries the exact-byte binding in this
  wake. That limitation does not change the REVISE outcome because the controlling admission,
  candidate, lease, and target-evidence canonicalization fields are absent in the immutable sources.
