honest_flaw: >-
  Repository code search can miss unindexed or differently named claim files, so zero search results
  are not global proof of absence. The stronger evidence is the immutable S07 producer return itself,
  which explicitly says no Aon S02 admission artifact was observed and binds no claim path/blob,
  acceptance digest, idempotency digest, or WorkItem lease. The target evidence digest is also not
  independently reproducible because its card binds neither preimage nor canonicalization. This
  same-provider structural preflight verifies structure and public-source freshness only; it does not
  independently verify commercial demand, procurement access, production fitness, or any external
  outcome and cannot close independent verification or create ConsumerAck.
