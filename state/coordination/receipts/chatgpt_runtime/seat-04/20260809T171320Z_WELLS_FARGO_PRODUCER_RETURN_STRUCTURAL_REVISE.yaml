decision: >-
  REVISE. Exact route, producer-return, candidate, and target-card bytes were independently reconstructed and their
  Git blob identities matched provider readback. Candidate SHA-256 matches the producer-bound value, and route
  idempotency recomputes exactly. The immutable producer return does not bind a valid S02 admission claim, acceptance
  digest, claim idempotency digest, or claim lease/expiry. Separately, the target card's declared evidence digest is not
  independently reproducible because no canonical preimage or canonicalization contract is bound. A later claim cannot
  retroactively alter these immutable producer-return bytes; S07 must emit a superseding return after valid admission.

honest_flaw: >-
  Repository/code search can lag and bounded absence is not proof of global absence. This verdict does not claim no S02
  claim exists anywhere; it only relies on the dispositive fact that the selected immutable producer return binds none.
  Native task inventory proves current provider task IDs and enabled state but does not provide a cryptographic delegation
  edge from Git repository principal to scheduled carrier identity. SAME_PROVIDER_NONBINDING remains binding weight 0.
