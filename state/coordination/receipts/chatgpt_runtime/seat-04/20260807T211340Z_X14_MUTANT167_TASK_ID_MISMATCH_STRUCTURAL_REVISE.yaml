  The negative control is structurally conspicuous because the immutable source declares an X12 campaign and X12 task ID while the injected ID belongs to an enabled X13 carrier. This wake independently recomputed the exact mutant bytes, Git blob, source bytes, Git blob, overlay digest, outbox-core digest, and message digest. It did not derive the source idempotency key from an independently persisted canonical idempotency preimage because the outbox does not contain that derivation contract, and it did not establish a provider-authenticated runtime actor principal. The later X12 Slack receipt proves delivery/direct-history only and explicitly does not prove ConsumerAck or exactly-once delivery. All S04 evidence here is same-provider and binding weight zero.
