  - code: MISSING_IMMUTABLE_S02_ADMISSION_BINDING
    disposition: REVISE
    evidence: >-
      The immutable S07 producer return explicitly records that no S02 admission claim was observed and binds no claim
      path/blob, acceptance digest, claim-idempotency digest, or claim lease/expiry. A claim created elsewhere or later
      cannot retroactively alter these immutable producer-return bytes.
    required_revision: >-
      After a valid immutable unexpired S02 admission claim exists for this exact WorkItem, S07 must emit a superseding
      immutable producer return that explicitly binds the claim path/blob, acceptance digest, idempotency digest,
      lease/expiry, exact candidate/source readback, rollback, effect ceiling, expiry, and honest flaw.
  - code: TARGET_EVIDENCE_DIGEST_CANONICALIZATION_UNBOUND
    disposition: REVISE
    evidence: >-
      The S08 target card declares evidence digest 2aa9ff2353e78a39e13f59666863dbb6987c8c9f1dc5dc40149a7c900dc1df66
      without binding its canonical evidence preimage or canonicalization contract. The exact target file independently
      recomputes to full-file SHA-256 9cf69f9b2213ba5b981cc9f3832708216d23e557919a0176121c1c258582e609,
      which does not make the separately declared evidence digest reproducible.

