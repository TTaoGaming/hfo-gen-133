controlling_revision_reason: >-
  The immutable S07 producer return explicitly records that no S02 admission claim was observed and binds no
  immutable claim path/blob, acceptance digest, claim idempotency digest, or claim lease/expiry for the exact
  WorkItem. A bounded exact WorkItem search does not establish global absence and is not treated as such; the
  producer return's own missing claim bindings control this defect. Independently, the S08 target card declares
  evidence SHA-256 8ab7c040... without binding the canonical evidence preimage or canonicalization; the full target
  file itself recomputes cleanly but does not equal that evidence digest, so the declared evidence digest cannot be
  independently reproduced. Candidate bytes, producer-return bytes, route bytes, Git blob identities, and route
  idempotency recompute exactly.

