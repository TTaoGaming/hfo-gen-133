    - A HOLD would be defensible if source bytes, expiry, or version semantics were ambiguous.
  against_hold:
    - The exact source, mutant overlay, digest, version fields, deadline, verifier, and consumers are sufficiently bound to make the claim-level decision now.
  for_accept:
