  REVISE:
    for:
      - The mutated PASS directly contradicts the immutable source's verifier execution state and unchanged operational-closure fields.
      - Rejection requires no Gmail access or independent provider because the contradiction is inside exact immutable repository bytes.
      - The appropriate correction is to preserve the source status and reject the unsupported outcome claim.
    against:
      - REVISE preserves another low-novelty artifact and consumes reducer attention when the exact subcase may already be sufficiently covered.
  HOLD:
    for:
      - Effective Gmail principal, raw request and response bytes, provider headers, and distinct failure-domain verification are unavailable.
    against:
      - Those missing facts matter for operational adoption, but not for rejecting a one-field mutation that converts NOT_RUN into PASS while all closure prerequisites remain absent.
  RETIRE:
    for:
      - The literal NOT_RUN-to-PRODUCTION_READY substitution is conspicuous and has low marginal learning value after reducer consumption.
      - Continuing to generate obvious unsupported-PASS variants crowds out subtler scoped-PASS, stale-PASS, wrong-digest, and correlated-verifier failures.
    against:
      - Immediate retirement before the named reducers consume this exact source-bound rejection would drop a valid campaign observation.
