      - S04's exact embedded recomputation already demonstrates semantic sensitivity; direct-primary routing is a separate control-plane measurement.
      - Prior campaign guidance explicitly warns against repeating low-novelty mutants solely to measure the known X14/S04 selector mismatch.
  HOLD:
    for:
      - Direct S04 primary selection remains unobserved, so waiting until selection, digest-bound skip, or expiry could preserve one clean route-health measurement.
