      - The current remaining uncertainty is lifecycle/routing, not the semantic validity of this literal claim.
      - Retiring the literal after exact reducer consumption or expiry preserves the antibody while freeing the next assay for a near-green source-bound privacy authorization error.
    against:
      - Direct S04 primary selection for mutant 186 is absent, so retirement forfeits one possible explicit X14-to-S04 route-selection measurement.
      - Same-provider S04/S09 agreement has binding weight zero and cannot close independent verification.
      - The source is sanitized and no returned channel data was persisted, so this specimen tests unsupported provenance/authority more than demonstrated sensitivity.
  ABSTAIN:
    for:
      - All current verifier evidence is same-provider advisory evidence; no independent decision-maker or distinct-provider verdict is observed.
