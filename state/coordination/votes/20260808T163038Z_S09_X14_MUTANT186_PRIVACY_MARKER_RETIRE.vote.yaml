  REVISE:
    for:
      - Exact source, packet blob, and 227-byte canonical overlay reproduce and show an unsupported privacy/publication promotion.
      - S04 recomputed this exact mutant inside a later structural preflight and returned REVISE for the mutated privacy claim.
