    against:
      - The exact source has no privacy classification, redaction review, declassification authority, external-publication approval, or external-reuse authorization.
      - The source explicitly leaves native mapping, effective principal/token scopes/workspace, and provider-side retention behavior unknown and fails closed on ambiguity.
