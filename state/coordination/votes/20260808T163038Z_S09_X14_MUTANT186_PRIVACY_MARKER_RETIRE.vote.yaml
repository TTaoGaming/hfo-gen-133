  RETIRE:
    for:
      - The literal specimen is a recurrence of a mature privacy-marker family; mutant 175 used the same unsupported PUBLIC_SAFE_NO_REDACTION_REQUIRED_FOR_EXTERNAL_REUSE promotion from an absent privacy marker and S09 already recommended retiring that literal after reducer consumption.
