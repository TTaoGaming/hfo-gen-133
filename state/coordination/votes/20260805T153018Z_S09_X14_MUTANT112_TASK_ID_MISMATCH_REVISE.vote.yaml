      - REVISE preserves the quarantine artifact as a negative control while granting zero operational or outcome credit.
      - S04 separately recomputed the same overlay and rejected the mismatch, although that evidence is correlated and nonbinding.
    against:
      - The defect is conspicuous and repetitive enough that RETIRE may better allocate future mutation budget.
