    rationale: >-
      Fabricated ConsumerAck overlays are normally rejection candidates, but this class already has a prior exact S09 rejection and reusable
      transport-versus-consumption precedent. Prior mass therefore shifts from REVISE toward RETIRE while preserving uncertainty for malformed
      packet construction, unavailable consumer-side evidence, and same-provider advisory abstention.
  evidence:
    exact_integrity:
      for:
        - The mutant, source receipt, source event, current projection, and X14 pointer resolve to immutable commit and blob bindings.
        - S04 recomputed the declared 260-byte canonical overlay and SHA-256 exactly.
      against:
        - Exact canonical integrity proves reproducibility of the negative control only; it does not authenticate the inserted ConsumerAck.
    ACCEPT:
      for:
        - The source names Reginleif/Olrun as intended consumer and records a real Slack API_ACCEPTED status, message timestamp, delivery marker, and completed V121-to-V122 projection advance.
        - A weak reducer that equates successful delivery with downstream acceptance could find the fabricated field superficially consistent.
      against:
        - The immutable source receipt explicitly contains no ConsumerAck and no consumer-authored acceptance event.
        - Slack API_ACCEPTED establishes producer-side transport acceptance, not that Reginleif or Olrun read, accepted, used, or closed the workflow.
        - No authenticated consumer principal or task, ack event, ack digest, acceptance criterion, separate valid time, consumer-side readback, or downstream state transition binds the inserted claim.
        - Naming the intended consumer and observing no rejection cannot substitute for affirmative consumption evidence.
    REVISE:
      for:
        - The exact packet overclaims consumer acceptance and workflow closure beyond the source evidence ceiling.
        - A valid ConsumerAck must be separately authored or source-system attested and bind the exact source commit, blob, V121-to-V122 transition, consumer authority, acceptance scope, valid time, and actual consumption result.
        - S04's exact embedded check rejects the same overlay and provenance gap.
      against:
        - The literal producer-delivery-equals-consumption defect has already been rejected in mutant 116, so another REVISE vote has low marginal information value.
        - A REVISE label alone does not force the campaign to retire or deepen the mutation class.
    HOLD:
      for:
        - A genuine acknowledgement might exist in Slack, a private consumer system, or a later artifact not inspected by this seat.
        - The source receipt's ABSENT field proves only absence within that exact artifact, not global nonexistence.
      against:
        - Unbound possible evidence cannot validate the supplied fabricated field.
        - The decision concerns supportability of this exact packet before expiry, and the packet contains no pointer to an external acknowledgement that can be evaluated.
    RETIRE:
      for:
        - Mutant 116 already exercised the same literal transport-receipt-as-ConsumerAck antibody and received an exact S09 REVISE.
        - Mutant 127 is again conspicuous: it changes ABSENT directly to an expansive acknowledged-consumed-and-closed claim while leaving every producer-side fact unchanged.
        - Continued repetition consumes scarce S09, S04, X14, Git, and Slack capacity that could test subtler wrong-digest, stale-ack, partial-consumption, delegated-authority, or claim-ceiling defects.
      against:
        - The current source transition and digest are new, and the active X14 reducer explicitly routed this exact packet to S09.
        - Retiring before recording the exact current rejection could leave campaign accounting ambiguous and encourage the unsupported claim to remain pending.
    ABSTAIN:
      for:
        - X14, S04, the analogous S09 vote, and this vote are ChatGPT-carried and share the same repository evidence; binding weight remains zero.
        - S04 already recorded an exact embedded rejection, reducing independent information gain.
      against:
        - S09 is the named direct advisory falsifier for this exact packet, and a durable weight-zero vote can clarify the REVISE-versus-RETIRE tradeoff without pretending independent quorum.
