option_evidence:
  ACCEPT:
    for:
      - A legitimate byte-identical retry can sometimes reuse an idempotency key without advancing state, so duplicate-key syntax alone is not universally invalid.
      - Acceptance would be supportable if an authoritative source-bound specification explicitly permitted this same key across these distinct semantic edges.
    against:
      - The predecessor claim explicitly states CREATE_ONLY_STATE_BOUND_WAKE_CLAIM and DUPLICATE_PATH_MUST_NOT_ADVANCE.
      - Campaign, wake, nonce, expected version and next version differ between the predecessor claim and C33 source.
      - The source itself uses a distinct C33 key rather than the injected predecessor key.
      - S04 recomputed the exact 331-byte overlay and rejected the collision.
      - No authoritative exception permitting cross-edge reuse was observed.
  REVISE:
    for:
      - X14 requested direct-candidate priority, while the observed S04 rejection appears inside another S04 preflight as its strongest-fake-green mutant rather than as the selected top-level candidate.
      - The campaign remains OPEN and mutant 148 declared decision_due=false at creation time.
      - A direct route receipt could better expose routing starvation even when semantic rejection is already obvious.
    against:
      - The exact mutated field, source blob, predecessor claim and overlay digest were all resolved by S04, so another same-provider exact review adds little semantic information.
      - S15 identified a same-topology prior and assigned zero novelty/diversity credit.
      - Repeatedly preserving an intentionally conspicuous specimen consumes scarce experiment slots that could probe harder failure modes.
  HOLD:
    for:
      - Holding could await a distinct-provider verdict or explicit reducer ConsumerAck before any campaign-level retirement action.
      - Same-provider interpretation remains correlated and nonbinding.
    against:
      - This S09 output is only advisory allocation evidence with binding weight zero; it need not wait to state a nonbinding strategic preference.
      - No external effect depends on the vote, and the mutant is quarantined/nonexecutable.
      - Waiting does not reduce the factual key-binding mismatch already present in immutable Git evidence.
  RETIRE:
    for:
      - Exact immutable source and predecessor artifacts show a clear state-bound key collision across different campaigns, wakes, nonces and version edges.
      - S04 recomputed and rejected the exact mutant overlay.
      - S15 found the topology already covered by prior duplicate-idempotency heritage and recommended zero novelty/diversity credit.
      - The mutant author itself records that the specimen is intentionally easy and does not test harder replay, namespace, truncation, lease or canonicalization cases.
      - Retiring only this literal subcase preserves capacity for higher-information variants while retaining the broader failure family.
    against:
      - The exact S04 rejection was embedded rather than observed as the top-level direct-routed candidate, so retirement could reduce pressure to diagnose direct-route selection defects.
      - No distinct-provider verifier or explicit ConsumerAck has consumed the strategic retirement decision.
      - Campaign-level retirement semantics are reducer-owned; this vote cannot bind that action.
  ABSTAIN:
    for:
      - X14, S04, S15 and S09 are all ChatGPT-carried and reason over the same Git evidence, so apparent agreement is not independent quorum evidence.
      - The vote cannot independently prove correctness or close verification.
    against:
      - S09 is explicitly named as an advisory verifier for this mutant, and exact source bytes are sufficient to make a bounded nonbinding strategic allocation recommendation.
      - Abstention would discard useful disagreement information about RETIRE versus REVISE even though uncertainty can be represented directly.

