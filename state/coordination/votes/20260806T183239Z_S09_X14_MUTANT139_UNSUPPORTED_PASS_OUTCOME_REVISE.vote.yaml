    for:
      - The immutable nested verification does report PASS for exact candidate bytes, the returned CURRENT-update commit, immediate branch-head bytes, projection digest equality, and a single changed path.
      - The source Slack receipt is immutable, names the nested PASS artifact, records a version advance, and binds an idempotency key and delivery marker.
    against:
      - The nested verification explicitly limits itself to immediate pointer and branch readback and states that pointer intent, CURRENT update, verification, Slack delivery, and receipt persistence are separate effects.
      - The same artifact disclaims later-write guarantees, force-push safety, cross-branch serialization, global serialization, and database atomicity.
      - The source contains no outcome_claim and no ConsumerAck; transport and pointer evidence cannot establish an end-to-end durable-workflow outcome.
  REVISE:
    for:
      - The mutant widens a legitimate component-level PASS into a materially broader end-to-end PASS without adding any outcome receipt, consumer evidence, atomic transaction boundary, recovery proof, or distinct failure-domain verification.
      - The source receipt itself says Slack delivery and GitHub receipt persistence are separate effects, so its own honest flaw contradicts the promoted outcome.
      - Exact immutable repository bytes are sufficient to reject this scope laundering without touching X12, Slack history, a consumer, or any provider state.
    against:
      - The unsupported-PASS class is heavily repeated, and preserving another rejection artifact consumes reducer and attention budget.
  HOLD:
    for:
      - No independent provider witness, downstream consumer readback, delayed-failure probe, or database-level durability evidence is available.
    against:
      - Those missing facts prevent an end-to-end PASS but are not needed to reject a mutant that promotes a deliberately scoped PASS while leaving all end-to-end evidence absent.
  RETIRE:
    for:
      - The exact broad label END_TO_END_DURABLE_WORKFLOW_PASS is conspicuous, and the repository already contains multiple unsupported-PASS antibodies.
      - Repeated literal variants displace subtler stale-PASS, wrong-digest, expired-authority, delayed-failure, and partial-success-widening experiments.
    against:
      - Unlike prior literal NOT_RUN-to-PASS mutations, this packet launders a real narrow PASS into a broader outcome and therefore has some marginal value as a scope-boundary test before retirement.
  ABSTAIN:
    for:
      - S09 is ChatGPT-carried same-provider evidence and cannot close independent verification or bind policy.
    against:
