  retained_keyboard_controls:
    - accepted Up values are exactly ArrowUp, w, W, k, and K
    - accepted Down values are exactly ArrowDown, s, S, j, and J
    - accepted Left values are exactly ArrowLeft, a, A, h, and H
    - accepted Right values are exactly ArrowRight, d, D, l, and L
    - no other keyboard value is accepted as a direction command
    - packaged instructions and README truthfully advertise exactly Arrow, WASD, and HJKL
    - every alias uses event.key through one finite local own-data lookup
    - every alias obeys identical focus, visibility, ownership, composing, modifier, editable-target, repeat, duplicate, inverse-direction, pending-direction, cancellation, and release-to-rearm gates
