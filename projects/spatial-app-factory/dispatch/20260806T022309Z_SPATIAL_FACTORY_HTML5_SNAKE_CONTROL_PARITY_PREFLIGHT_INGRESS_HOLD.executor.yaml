    - a rejected event does not claim cancellation or mutate direction, pending state, activation count, or cancellation count
  movement_and_visibility:
    - at most one valid perpendicular pending direction is accepted per movement tick
    - committed direction changes only on a movement tick
    - 8 fps and 60 fps traces match
    - visibilityState hidden independently clears pending keyboard and spatial intent
    - visible-to-hidden during BEGIN or HELD emits exactly one CANCEL, no COMMIT, and enters REQUIRE_RELEASE
    - all commands are rejected while hidden without state mutation
    - hidden-to-visible does not auto-resume, auto-commit, replay held input, increment action count, or auto-rearm
    - visibility, focus, ownership, and neutral release are revalidated before fresh acceptance
    - duplicate visibility notifications do not duplicate cancellation or transitions
  browser_and_packaging:
