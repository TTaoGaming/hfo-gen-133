implementation_contract:
  adapter_surface:
    - export a pure mapping seam from normalized sample fields to ordinary pointer event descriptors
    - support normalized x and y positions with deterministic viewport conversion
    - emit pointermove for a valid tracked sample
    - emit exactly one pointerdown on pinch threshold crossing and exactly one pointerup on release
    - suppress duplicate pointerdown while pinch remains held
    - ignore invalid, missing, non-finite, or below-confidence samples
    - permit injected event factories and targets so Node tests do not require a browser DOM
  integration_surface:
    - load the adapter from prototypes/fab-prototype.html without external dependencies
    - connect through one explicit custom spatial-input seam or equally narrow adapter call
    - do not remove, intercept, preventDefault, or replace native click, keyboard, mouse, or touch paths
    - camera or MediaPipe integration is out of scope; deterministic synthetic samples are sufficient for this proof
  code_quality:
    - smallest patch that satisfies the frozen tests
    - no framework, bundler, backend, auth, analytics, or new dependency
    - comments explain public adapter contract and fallback boundary, not architecture speculation

