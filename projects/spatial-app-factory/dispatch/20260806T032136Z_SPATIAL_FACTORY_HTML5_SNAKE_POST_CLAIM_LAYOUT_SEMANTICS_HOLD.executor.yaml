acceptance_tests:
  admission_and_semantics:
    - fresh S02 successor binds both post-claim evidence commits, paths, blobs, and the prior heritage pointer
    - successor chooses exactly one of CHARACTER_VALUE_SEMANTICS or PHYSICAL_US_QWERTY_POSITION_SEMANTICS
    - successor acceptance digest and packaged documentation state the chosen model without claiming both
    - exact S04 PASS_STRUCTURAL binds the successor SHA, path, blob, source digest, acceptance digest, idempotency key, and clocks
  structural_and_provenance:
    - branch is rooted exactly at TTaoGaming/TAGS@1271e25306fe8ef8baea32704cf022435703d498
    - every changed path is under prototypes/html5-snake-spatial-canary/**
    - copied upstream bytes match only the four allowlisted blobs from JDStraughan/html5-snake@e3fe18a85a0555f0540cc0978fbab62822262a91
    - complete MIT notice and file-level provenance manifest exist in actual packaged bytes
    - html5shiv locators, plaintext HTTP, activatable external links, and unexpected runtime network requests are absent
  namespace_and_seam:
    - Object.prototype has no own getKey before or after page load and no native prototype is written
    - numeric keyCode tables and for-in direction lookup are absent
    - all runnable JavaScript bindings are explicitly declared inside a lexical boundary
    - mutable page-global control state and implicit globals are absent
    - all retained keyboard aliases and spatial DIRECT_COMMAND converge on exactly one requestDirection seam
    - DIRECT_COMMAND is the sole spatial activation owner
    - no DOM hit testing, synthetic pointer or mouse events, dispatchEvent, pointer capture, or fabricated pointer identity is used
  keyboard_layout_contract:
    - character-value mode accepts only the named event.key values emitted by the active layout and documents that limitation
    - physical-position mode binds exact event.code positions and revises the no-other-values gates and documentation accordingly
    - upper/lower-case coverage is not counted as cross-layout proof
    - Arrow controls retain named-key semantics in either selected model
    - every retained alias obeys identical focus, visibility, ownership, composing, modifier, editable-target, repeat, duplicate, inverse-direction, pending-direction, cancellation, and release-to-rearm gates
    - accepted cancelable events call preventDefault exactly once and rejected events do not mutate control state or counters
  movement_visibility_and_browser:
    - at most one valid perpendicular pending direction is accepted per movement tick and 8 fps and 60 fps traces match
    - hidden visibility clears pending intent, cancels BEGIN or HELD exactly once, rejects commands, and requires neutral release before rearm
    - exact-SHA Chromium and Firefox fixtures cover alias parity, rejection, focus loss, hidden visibility, held-input restore, namespace isolation, zero network, and instruction parity
    - native-input traces under US-QWERTY and at least one non-QWERTY layout match the selected semantic contract
  producer_return_schema:
    - runtime_and_model
    - target_branch_and_exact_sha
    - base_sha
    - changed_paths
    - exact_commands
    - exit_codes
    - outputs
    - blockers
    - rollback
    - honest_flaw
  verification_and_consumption:
