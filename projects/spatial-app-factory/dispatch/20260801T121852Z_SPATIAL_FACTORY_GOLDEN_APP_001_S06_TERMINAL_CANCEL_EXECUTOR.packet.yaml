    - centralize interruption handling so invalid tracking, reset, disarm, and target loss share duplicate-safe terminal behavior
    - clear local held/target/coordinate state only after the one terminal cancellation signal has been produced or deliberately routed to the host-cleanup seam
  usable_target_path:
    - dispatch exactly one event with type pointercancel to the active target
    - event must be synthetic and untrusted; do not claim trusted user activation
    - preserve pointerId, pointerType, isPrimary, and last-known clientX/clientY from the active cycle
    - set cancelable false, buttons 0, button 0 or another explicitly tested terminal value, bubbles true, and invoke no activation callback
  unusable_target_path:
    - never dispatch an event to a target whose isConnected is false or whose dispatchEvent is unavailable
    - expose exactly one host-observable cancellation signal through a minimal injected callback or explicit return value
    - bind the signal to the same pointer identity and last-known coordinates and label the reason
  duplicate_and_recovery_rules:
    - repeated invalid samples, reset, disarm, target-loss observations, or later release after cancellation produce no second cancel and no activation
    - re-arming alone must not resurrect the cancelled held cycle
    - the next new threshold-crossing pinch emits one new pointerdown and may later complete through one normal pointerup and one activation
  compatibility_rules:
    - preserve deterministic coordinate mapping, hysteresis, fixed-target continuity, valid-release exactly-once activation, and held/repeated-release behavior
    - preserve current module/global export shape and dependency-free Node-test seam
    - smallest patch satisfying the acceptance contract; no new framework, generalized gesture architecture, second app, or unrelated cleanup

