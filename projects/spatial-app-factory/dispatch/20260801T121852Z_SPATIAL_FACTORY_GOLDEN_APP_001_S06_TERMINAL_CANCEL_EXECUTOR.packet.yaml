  later release must not duplicate cancellation, and the next valid pinch must begin a fresh cycle. Preserve fixed
  target continuity, exactly-one valid-release activation, held/repeated-release protections, and native
  mouse/touch/keyboard fallback. No browser-trusted activation, pointer-capture, deployment, or production claim.

