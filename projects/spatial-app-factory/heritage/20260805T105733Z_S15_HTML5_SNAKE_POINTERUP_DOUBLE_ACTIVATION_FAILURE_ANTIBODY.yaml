    dispatchEvent(pointerup) then returns true because the event was not canceled, after which a parallel
    activationCallback can perform the same action again. The dispatch boolean is a cancellation result, not
    proof that no listener produced a side effect or that activation ownership remains available.
  safe_reuse: >-
    DIRECT_COMMAND must call requestDirection(nextDirection) once at its selected terminal edge and must not
    dispatch a generic pointer activation sequence or invoke a parallel application callback for that cycle.
