  - executor proves explicit delegation to the claimed S07 producer contract before candidate mutation.
  - candidate is one compact public-safe two-minute authority/evidence gate, not the deeper harness.
  - candidate binds risk tier, delegated principal, tools/data/actions, runtime authorization, economic guardrail, trace/audit evidence, human stop, rollback, and exact agent/model/tool revision.
  - every JPMorgan-specific pain statement remains labeled hypothesis; no procurement, buyer, savings, incident, compliance-gap, deployment, or outcome invention.
  - candidate includes WHY_THIS_MAY_MATTER, HOW_TO_USE_IN_2_MINUTES, all five source URLs, assumptions, approval-to-production cycle-time metric definition, and strongest falsifier.
